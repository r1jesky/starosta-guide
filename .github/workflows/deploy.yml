name: Deploy to GitHub Pages

# Собирает сайт и публикует его на GitHub Pages при каждом пуше в main.
# Перед первым запуском включи Pages: Settings → Pages → Source → GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # base-href подставляется из имени репозитория: сайт живёт по адресу
      # https://<логин>.github.io/<репозиторий>/
      - run: npx ng build --base-href "/${{ github.event.repository.name }}/"

      # чтобы GitHub Pages не пытался обработать сборку через Jekyll
      - run: touch dist/starosta-guide/browser/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/starosta-guide/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
