@if (open()) {
  <div class="scrim" (click)="closed.emit()">
    <div
      class="panel"
      role="dialog"
      aria-modal="true"
      aria-label="Поиск по памятке"
      (click)="$event.stopPropagation()"
    >
      <div class="field">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="field__icon">
          <circle cx="11" cy="11" r="6.5" />
          <path d="m16 16 4 4" />
        </svg>
        <input
          #field
          class="field__input"
          type="search"
          placeholder="Больничный, стипендия, справка, корпус…"
          autocomplete="off"
          spellcheck="false"
          [value]="query()"
          (input)="onInput($event)"
        />
        <button type="button" class="field__close" (click)="closed.emit()" aria-label="Закрыть поиск">
          Esc
        </button>
      </div>

      <div class="results">
        @if (!hasQuery()) {
          <p class="hint">Введите хотя бы два символа — поиск идёт по всем разделам памятки.</p>
        } @else if (results().length === 0) {
          <p class="hint">Ничего не нашлось. Попробуйте другое слово или загляните в содержание.</p>
        } @else {
          <ul class="list">
            @for (result of results(); track $index) {
              <li>
                <button type="button" class="result" (click)="goTo(result)">
                  <span class="result__section">{{ result.sectionTitle }}</span>
                  <span class="result__heading">
                    @for (part of result.headingParts; track $index) {
                      @if (part.hit) {
                        <mark>{{ part.text }}</mark>
                      } @else {
                        {{ part.text }}
                      }
                    }
                  </span>
                  <span class="result__text">
                    @for (part of result.parts; track $index) {
                      @if (part.hit) {
                        <mark>{{ part.text }}</mark>
                      } @else {
                        {{ part.text }}
                      }
                    }
                  </span>
                </button>
              </li>
            }
          </ul>
        }
      </div>
    </div>
  </div>
}
