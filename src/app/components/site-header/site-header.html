<div class="bar">
  <div class="page bar__inner">
    <a class="brand" href="#top" aria-label="Совет старост Самарского университета — в начало">
      <img class="brand__logo" [src]="logoSrc()" alt="Совет старост Самарского университета" />
      <span class="brand__divider" aria-hidden="true"></span>
      <span class="brand__title">Памятка<br />первокурсника</span>
    </a>

    <div class="actions">
      <button type="button" class="action action--search" (click)="searchOpen.emit()">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="action__icon">
          <circle cx="11" cy="11" r="6.5" />
          <path d="m16 16 4 4" />
        </svg>
        <span class="action__label">Поиск</span>
        <kbd class="action__kbd">/</kbd>
      </button>

      <button
        type="button"
        class="action action--icon"
        (click)="toggleTheme()"
        [attr.aria-label]="theme() === 'dark' ? 'Включить светлую тему' : 'Включить тёмную тему'"
      >
        @if (theme() === 'dark') {
          <svg viewBox="0 0 24 24" aria-hidden="true" class="action__icon">
            <circle cx="12" cy="12" r="4.2" />
            <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" aria-hidden="true" class="action__icon">
            <path d="M20 14.4A8.4 8.4 0 0 1 9.6 4a8.4 8.4 0 1 0 10.4 10.4z" />
          </svg>
        }
      </button>
    </div>
  </div>
</div>

<nav class="rail" aria-label="Разделы памятки">
  <div class="page rail__inner">
    @for (section of sections(); track section.id) {
      <a class="chip" [class.chip--active]="activeId() === section.id" [href]="'#' + section.id">
        {{ section.title }}
      </a>
    }
  </div>
</nav>
